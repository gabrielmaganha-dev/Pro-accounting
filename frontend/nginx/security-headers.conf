# =============================================================================
# Cabeçalhos de segurança da INTERFACE
# =============================================================================
# Incluído pelas rotas que servem arquivos da interface (não pela rota /api: a
# API define os próprios cabeçalhos, via helmet, e repeti-los aqui duplicaria
# cada um na resposta).
#
# Por que um arquivo separado, e não `add_header` no bloco `server`: no nginx,
# basta UMA diretiva `add_header` dentro de um `location` para todas as do
# nível de cima deixarem de valer ali. As rotas da interface precisam definir
# Cache-Control, então perderiam estes cabeçalhos em silêncio. Com `include`,
# cada rota os declara explicitamente.
# =============================================================================

# Política de conteúdo: de onde o navegador pode carregar cada tipo de recurso.
# É a principal contenção contra XSS — e pesa mais aqui porque o token de
# sessão fica no localStorage, ao alcance de qualquer script que rode na página.
#
#   script-src 'self'         só os arquivos .js do próprio sistema. Nenhum
#                             script embutido no HTML e nenhum de outro domínio:
#                             um <script> injetado simplesmente não executa.
#   style-src 'unsafe-inline' necessário: os componentes posicionam menus e
#                             desenham gráficos com atributo style. Estilo
#                             embutido não executa código.
#   fonts.googleapis.com / fonts.gstatic.com
#                             a fonte Inter, carregada pelo index.html.
#   img-src data:             o logotipo configurado é guardado como data URL.
#   img-src *.googleusercontent.com
#                             a foto do perfil de quem entra com o Google.
#   connect-src 'self'        a interface fala com a própria origem (/api)...
#   connect-src *.supabase.co ...e com o Supabase Auth, só no login com Google
#                             (troca do código de retorno do Google).
#   frame-ancestors 'none'    ninguém pode embutir o sistema num <iframe>
#                             (impede clickjacking).
#
# Se a API for publicada em OUTRO domínio, acrescente-o em connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Impede o navegador de "adivinhar" o tipo de um arquivo e executá-lo.
add_header X-Content-Type-Options "nosniff" always;

# Reforço do frame-ancestors para navegadores antigos.
add_header X-Frame-Options "DENY" always;

# Ao seguir um link para fora, o outro site recebe só o domínio — não o
# endereço completo, que carrega ids de cliente e de fatura.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# O sistema não usa câmera, microfone, localização nem pagamento do navegador.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Isola a janela do sistema de páginas de outros sites abertas a partir dela.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# HSTS: só quando a requisição chegou por HTTPS (ver o `map` em
# default.conf.template). Com valor vazio o nginx não emite o cabeçalho — e
# enviá-lo por HTTP puro, numa intranet sem certificado, seria inútil.
add_header Strict-Transport-Security $hsts_header always;
