<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pro Accounting">
  <defs>
    <linearGradient id="pa-mark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>

  <!-- Placa institucional (azul corporativo) -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#pa-mark-bg)" />

  <!-- Colunas ascendentes: leitura de crescimento / balancete -->
  <rect x="16" y="31" width="8" height="15" rx="2.5" fill="#FFFFFF" fill-opacity="0.5" />
  <rect x="28" y="24" width="8" height="22" rx="2.5" fill="#FFFFFF" fill-opacity="0.78" />
  <rect x="40" y="16" width="8" height="30" rx="2.5" fill="#FBBF24" />

  <!-- Linha de base do balancete -->
  <rect x="15" y="48" width="34" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.38" />
</svg>
