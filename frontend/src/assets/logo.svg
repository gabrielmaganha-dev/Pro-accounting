<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 64" width="248" height="64" role="img" aria-label="Pro Accounting">
  <defs>
    <linearGradient id="pa-logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>

  <!-- Símbolo -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#pa-logo-bg)" />
  <rect x="16" y="31" width="8" height="15" rx="2.5" fill="#FFFFFF" fill-opacity="0.5" />
  <rect x="28" y="24" width="8" height="22" rx="2.5" fill="#FFFFFF" fill-opacity="0.78" />
  <rect x="40" y="16" width="8" height="30" rx="2.5" fill="#FBBF24" />
  <rect x="15" y="48" width="34" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.38" />

  <!-- Assinatura tipográfica -->
  <g font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
    <text x="80" y="30" font-size="24" font-weight="700" letter-spacing="-0.4" fill="#1E3A8A">Pro</text>
    <text x="80" y="52" font-size="20" font-weight="500" letter-spacing="0.6" fill="#475569">Accounting</text>
  </g>
</svg>
